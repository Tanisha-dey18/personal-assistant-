# Render Blueprint: backend web service + managed Postgres.
# Qdrant: use Qdrant Cloud (free 1GB cluster) and set QDRANT_URL / QDRANT_API_KEY.
# Redis (optional): Render Key Value or Upstash; set REDIS_URL.
services:
  - type: web
    name: astra-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: astra-db
          property: connectionString
databases:
  - name: astra-db
    plan: free
