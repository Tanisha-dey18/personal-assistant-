# Render Blueprint — backend on Render's FREE web service.
#
# Database: Render's free Postgres is deleted after 30 days, which would wipe JARVIS's memory,
# so use a free, permanent Postgres from Neon (neon.tech) or Supabase (supabase.com) and paste
# its connection string into DATABASE_URL (sslmode=require URLs are handled automatically).
# Vectors: Qdrant Cloud free cluster → QDRANT_URL / QDRANT_API_KEY.
# Note: free web services sleep after ~15 min idle; the first request then takes ~30-60 s.
services:
  - type: web
    name: astra-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOW_REGISTRATION
        value: "true"
